name: Build PassWall2 APK Repo

on:
  schedule:
    - cron: '20 */4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild even if upstream version unchanged
        type: boolean
        default: false

concurrency:
  group: "build-repo"
  cancel-in-progress: true

env:
  UPSTREAM_REPO: Openwrt-Passwall/openwrt-passwall2
  ARCHES: x86_64 aarch64_cortex-a53 aarch64_generic
  PUBKEY_NAME: passwall2-repo.rsa.pub
  LANGS: zh-cn zh-tw
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup retry function
        run: |
          cat << 'EOF' > /tmp/retry.sh
          with_retry() {
            local max_attempts=3
            local timeout=5
            local attempt=1
            local exitCode=0
            while [ $attempt -le $max_attempts ]; do
              if "$@"; then
                return 0
              else
                exitCode=$?
                echo "::warning::Command '$1' failed with exit code $exitCode. Attempt $attempt of $max_attempts." >&2
                if [ $attempt -lt $max_attempts ]; then
                  sleep $timeout
                fi
              fi
              attempt=$((attempt + 1))
            done
            echo "::error::Command '$1' failed after $max_attempts attempts." >&2
            return $exitCode
          }
          EOF

      - name: Fetch upstream latest tag
        id: upstream
        run: |
          source /tmp/retry.sh
          TAG=$(with_retry gh release view --repo "${UPSTREAM_REPO}" --json tagName -q '.tagName')
          [ -n "$TAG" ] || { echo "::error::Could not resolve upstream latest tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Upstream latest: $TAG"

      - name: Decide whether to rebuild
        id: state
        run: |
          source /tmp/retry.sh
          EXISTS=false
          MISSING_ARCHES=""
          if ASSETS=$(with_retry gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null); then
            EXISTS=true
            CUR="$TAG"
            for ARCH in $ARCHES; do
              if ! printf '%s\n' "$ASSETS" | grep -qx "passwall2-${ARCH}-${TAG}.zip"; then
                MISSING_ARCHES="${MISSING_ARCHES} ${ARCH}"
              fi
            done
          else
            CUR="<none>"
          fi

          echo "Current matching release in this repo: ${CUR}"
          if [ -n "$MISSING_ARCHES" ]; then
            echo "::notice::Existing release ${TAG} is missing arches:${MISSING_ARCHES}; will rebuild"
          fi

          if [ "${{ inputs.force }}" = "true" ] || [ "$EXISTS" != "true" ] || [ -n "$MISSING_ARCHES" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
            echo "::notice::Already up to date ($TAG) with all arches; nothing to do."
          fi

      - name: Restore private key, derive public key
        if: steps.state.outputs.go == 'true'
        env:
          KEY: ${{ secrets.APK_SIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret APK_SIGN_PRIVATE_KEY is not set."
            exit 1
          fi
          mkdir -p keys
          printf '%s\n' "$KEY" > keys/private.pem
          chmod 600 keys/private.pem
          openssl rsa -in keys/private.pem -pubout -out "keys/${PUBKEY_NAME}" 2>/dev/null

      - name: Download arch-independent packages
        if: steps.state.outputs.go == 'true'
        run: |
          source /tmp/retry.sh
          set -eu
          mkdir -p common
          
          echo "Downloading main app..."
          with_retry gh release download "$TAG" --repo "${UPSTREAM_REPO}" --pattern "luci-app-passwall2-[0-9]*.apk" --dir common
          
          echo "Downloading language packs..."
          for L in $LANGS; do
            with_retry gh release download "$TAG" --repo "${UPSTREAM_REPO}" --pattern "luci-i18n-passwall2-${L}-*.apk" --dir common || echo "  skip ${L} (not in release)"
          done
          
          echo "Common apks:"
          ls -la common/

      - name: Build per-arch repos
        if: steps.state.outputs.go == 'true'
        run: |
          source /tmp/retry.sh
          set -eu
          mkdir -p site zips
          cp "keys/${PUBKEY_NAME}" "site/${PUBKEY_NAME}"

          for ARCH in $ARCHES; do
            echo "::group::Prepare ${ARCH}"
            ARCHDIR="site/${ARCH}"
            mkdir -p "$ARCHDIR"

            DOWNLOAD_SUCCESS=false
            if with_retry gh release download "$TAG" --repo "${UPSTREAM_REPO}" --pattern "passwall_packages_apk_${ARCH}.zip" --dir "$ARCHDIR"; then
              DOWNLOAD_SUCCESS=true
            else
              echo "::warning::Deps zip not found in ${TAG} for ${ARCH}. Searching older releases..."
              FALLBACK_TAG=$(with_retry gh api repos/${UPSTREAM_REPO}/releases 2>/dev/null | jq -r "map(select(.assets != null and (.assets | map(.name) | contains([\"passwall_packages_apk_${ARCH}.zip\"])))) | .[0].tag_name // \"null\"")
              if [ "$FALLBACK_TAG" != "null" ] && [ -n "$FALLBACK_TAG" ]; then
                echo "::notice::Found fallback tag ${FALLBACK_TAG} for ${ARCH}, downloading..."
                if with_retry gh release download "$FALLBACK_TAG" --repo "${UPSTREAM_REPO}" --pattern "passwall_packages_apk_${ARCH}.zip" --dir "$ARCHDIR"; then
                  DOWNLOAD_SUCCESS=true
                fi
              fi
            fi

            if [ "$DOWNLOAD_SUCCESS" = "true" ]; then
              ZIP_FILE="$ARCHDIR/passwall_packages_apk_${ARCH}.zip"
              unzip -j -q "$ZIP_FILE" -d "$ARCHDIR"
              rm "$ZIP_FILE"
            else
              echo "::warning::No deps zip for ${ARCH} after retries and fallback, skipping"
              rm -rf "$ARCHDIR"
              echo "::endgroup::"
              continue
            fi

            cp -l common/*.apk "$ARCHDIR/" 2>/dev/null || cp common/*.apk "$ARCHDIR/"
            echo "Packages in ${ARCH}: $(ls -1 "$ARCHDIR"/*.apk | wc -l)"
            echo "::endgroup::"
          done

          echo "::group::Sign APK indexes"
          docker run --rm \
            -v "$PWD/site:/site" \
            -v "$PWD/keys:/keys:ro" \
            -e TAG="$TAG" \
            -e ARCHES="$ARCHES" \
            alpine:edge \
            sh -eu -c '
              apk add --no-cache apk-tools >/dev/null
              for ARCH in $ARCHES; do
                if [ -d "/site/$ARCH" ]; then
                  echo "Signing $ARCH..."
                  cd "/site/$ARCH"
                  apk mkndx \
                    --allow-untrusted \
                    --output packages.adb \
                    --sign-key /keys/private.pem \
                    *.apk
                fi
              done
            '
          echo "::endgroup::"

          echo "::group::Create zip snapshots"
          for ARCH in $ARCHES; do
            if [ -d "site/${ARCH}" ]; then
              (cd site && zip -qr "../zips/passwall2-${ARCH}-${TAG}.zip" "${ARCH}")
            fi
          done
          echo "::endgroup::"

          echo "Site layout:"
          find site -maxdepth 2 -type f | sort
          echo "Zip snapshots:"
          ls -la zips/

          ZIP_COUNT=$(find zips -maxdepth 1 -name "*.zip" | wc -l)
          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "::error::所有架构均构建失败，已中止后续更新以保护原有页面和 Release。"
            exit 1
          fi

      - name: Write site README
        if: steps.state.outputs.go == 'true'
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          REL_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          {
            echo "# PassWall2 APK repository"
            echo ""
            echo "Rebuilt mirror of [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) **${TAG}**,"
            echo "signed as OpenWrt 25.12 APK feeds. Check for upstream updates every 4 hours."
            echo ""
            echo "## Online feed (recommended)"
            echo ""
            echo "Pick the URL matching your router's architecture; register the **full packages.adb URL**"
            echo "explicitly to avoid apk's legacy \`APKINDEX.tar.gz\` fallback warning:"
            echo ""
            echo "| Arch | Feed URL |"
            echo "|---|---|"
            for ARCH in $ARCHES; do
              [ -d "site/${ARCH}" ] && echo "| \`${ARCH}\` | \`${PAGES_URL}/${ARCH}/packages.adb\` |"
            done
            echo ""
            echo '```sh'
            echo "# 1. Trust this repo's signing key (one time)"
            echo "wget -O /etc/apk/keys/${PUBKEY_NAME} \\"
            echo "    ${PAGES_URL}/${PUBKEY_NAME}"
            echo ""
            echo "# 2. Register the feed (replace <arch>)"
            echo "echo \"${PAGES_URL}/<arch>/packages.adb\" >> /etc/apk/repositories.d/customfeeds.list"
            echo ""
            echo "# 3. Install"
            echo "apk update"
            echo "apk add luci-app-passwall2"
            echo "apk add luci-i18n-passwall2-zh-cn"
            echo "/etc/init.d/rpcd restart"
            echo '```'
            echo ""
            echo "## Offline snapshot"
            echo ""
            echo "Per-arch zip archives on the [\`${TAG}\`](${REL_URL%/download/*}/tag/${TAG}) release:"
            echo ""
            for ARCH in $ARCHES; do
              [ -f "zips/passwall2-${ARCH}-${TAG}.zip" ] && \
                echo "- [passwall2-${ARCH}-${TAG}.zip](${REL_URL}/passwall2-${ARCH}-${TAG}.zip)"
            done
            echo ""
            echo "Extract, put the directory somewhere webserver-reachable, and point apk at its \`packages.adb\`."
          } > site/README.md

          cp site/README.md zips/README.md

      - name: Publish to gh-pages
        if: steps.state.outputs.go == 'true'
        run: |
          source /tmp/retry.sh
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -q -m "passwall2 ${TAG}"
          with_retry git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          echo "Pushed to gh-pages. Pages will update in ~1 min at:"
          echo "  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Create release
        if: steps.state.outputs.go == 'true'
        run: |
          source /tmp/retry.sh
          NOTES="OpenWrt 25.12 APK repo (multi-arch), rebuilt from **${UPSTREAM_REPO} ${TAG}**.

          - **Online feed**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (see README)
          - **Offline snapshots**: per-arch zips below"

          if [ "${{ steps.state.outputs.exists }}" = "true" ]; then
            echo "Existing release ${TAG} found; updating assets in place"
            with_retry gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "${TAG}" \
              --notes "$NOTES"
            with_retry gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              zips/*.zip \
              "keys/${PUBKEY_NAME}" \
              zips/README.md
          else
            with_retry gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "${TAG}" \
              --notes "$NOTES" \
              zips/*.zip \
              "keys/${PUBKEY_NAME}" \
              zips/README.md
          fi

          echo "Published: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
